name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build both locales
        run: node scripts/build.mjs

      - name: Fail on unresolved template holes
        run: |
          if grep -rqE '\{\{[a-zA-Z0-9_.]+\}\}' index.html en/index.html; then
            echo "::error::Unresolved {{i18n}} holes in generated HTML"
            grep -roE '\{\{[a-zA-Z0-9_.]+\}\}' index.html en/index.html | sort -u
            exit 1
          fi
          if grep -rqE '<!--(SOCIAL|LANG|WHATSAPP_[A-Z_]+|RATING_[A-Z_]+|CAPABILITIES|REVIEWS|HOURS)-->' index.html en/index.html; then
            echo "::error::Unresolved template markers in generated HTML"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
